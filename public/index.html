<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY TO-DO LIST</title>

  <!-- ============================================================
       1) 외부 리소스 불러오기
       - Tailwind CSS: 클래스 이름만으로 스타일을 입힐 수 있는 CSS 도구 (CDN 방식이라 설치 불필요)
       - Pretendard: 한글이 깔끔하게 보이는 무료 폰트
       ============================================================ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <script>
    // Tailwind에 우리만의 블랙 & 화이트 색상 팔레트를 등록합니다.
    // 이렇게 등록하면 bg-beige-100, text-sage-600 처럼 사용할 수 있어요.
    // (이름은 처음 버전 그대로 두고 값만 흑백으로 바꿨어요)
    //  - beige : 배경용 밝은 회색 계열
    //  - sage  : 포인트 색 (검정 ~ 회색)
    //  - stone : 글자용 회색 계열
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'system-ui', 'sans-serif'],
          },
          colors: {
            beige: { 50: '#FAFAFA', 100: '#F2F2F2', 200: '#E5E5E5', 300: '#D4D4D4' },
            sage:  { 100: '#F0F0F0', 200: '#D9D9D9', 300: '#BDBDBD', 500: '#111111', 600: '#000000', 700: '#111111' },
            stone: { 400: '#A3A3A3', 500: '#737373', 600: '#525252', 700: '#1F1F1F' },
          },
          boxShadow: {
            soft: '0 8px 30px rgba(0, 0, 0, 0.06)',
          },
        },
      },
    };
  </script>

  <style>
    /* ------------------------------------------------------------
       2) Tailwind로 표현하기 번거로운 세부 스타일
       ------------------------------------------------------------ */

    /* 체크박스를 둥글고 예쁘게 커스터마이징 */
    .todo-check {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #D4D4D4;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
      display: grid;
      place-content: center;
      transition: all 0.2s ease;
      background: #fff;
    }
    .todo-check:hover { border-color: #111; }
    .todo-check:checked {
      background: #111;
      border-color: #111;
    }
    /* 체크되었을 때 나타나는 흰색 체크 표시(✓) */
    .todo-check:checked::after {
      content: '';
      width: 6px;
      height: 11px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    /* 할 일이 새로 추가될 때 살짝 떠오르는 애니메이션 */
    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .pop-in { animation: popIn 0.25s ease-out; }

    /* 프로그레스 바가 부드럽게 늘어나도록 */
    #progressFill { transition: width 0.5s cubic-bezier(.4,0,.2,1); }

    /* 스크롤바를 얇고 은은하게 */
    .soft-scroll::-webkit-scrollbar { width: 6px; }
    .soft-scroll::-webkit-scrollbar-thumb { background: #E5E5E5; border-radius: 999px; }
  </style>
</head>

<body class="bg-beige-100 font-sans text-stone-700 antialiased">

  <!-- ============================================================
       3) 전체 레이아웃: 화면을 좌우로 반반 나누는 Split-Screen
       - 큰 화면(lg 이상): 좌우 2칸
       - 작은 화면(모바일): 위아래로 쌓임
       ============================================================ -->
  <main class="min-h-screen grid grid-cols-1 lg:grid-cols-2 gap-6 p-4 sm:p-8 lg:p-12">

    <!-- ==========================================================
         [왼쪽 영역] 월별 달력
         ========================================================== -->
    <section class="bg-beige-50 rounded-[2rem] shadow-soft p-6 sm:p-10 flex flex-col">

      <!-- 서비스 이름 (미니멀한 영어 타이틀) -->
      <div class="mb-10">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-[0.2em] text-black">MY TO-DO LIST</h1>
        <div class="w-10 h-[3px] bg-black mt-4"></div>
      </div>

      <!-- 달력 상단: 연도/월 + 이전/다음 버튼 -->
      <div class="flex items-center justify-between mb-6">
        <button id="prevMonthBtn"
                class="w-10 h-10 rounded-full bg-white hover:bg-sage-100 text-stone-600 shadow-sm transition"
                aria-label="이전 달">
          &#8249;
        </button>

        <h2 id="monthTitle" class="text-xl font-semibold"></h2>

        <button id="nextMonthBtn"
                class="w-10 h-10 rounded-full bg-white hover:bg-sage-100 text-stone-600 shadow-sm transition"
                aria-label="다음 달">
          &#8250;
        </button>
      </div>

      <!-- 요일 표시 (일 ~ 토) -->
      <div class="grid grid-cols-7 text-center text-sm font-medium mb-2">
        <div class="py-2 text-stone-400">일</div>
        <div class="py-2 text-stone-500">월</div>
        <div class="py-2 text-stone-500">화</div>
        <div class="py-2 text-stone-500">수</div>
        <div class="py-2 text-stone-500">목</div>
        <div class="py-2 text-stone-500">금</div>
        <div class="py-2 text-stone-400">토</div>
      </div>

      <!-- 날짜 칸들이 JavaScript로 채워지는 곳 -->
      <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2"></div>

      <!-- 오늘로 돌아가기 버튼 + 범례 -->
      <div class="mt-auto pt-8 flex flex-wrap items-center justify-between gap-3 text-xs text-stone-500">
        <div class="flex items-center gap-4">
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-md border-2 border-sage-500"></span>오늘</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-md bg-sage-500"></span>선택한 날</span>
          <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-sage-500"></span>할 일 있음</span>
        </div>
        <button id="todayBtn"
                class="px-4 py-2 rounded-full bg-white hover:bg-sage-100 text-sage-700 font-medium shadow-sm transition">
          오늘로 이동
        </button>
      </div>
    </section>

    <!-- ==========================================================
         [오른쪽 영역] 투두리스트
         ========================================================== -->
    <section class="bg-white rounded-[2rem] shadow-soft p-6 sm:p-10 flex flex-col">

      <!-- 선택한 날짜 타이틀 -->
      <div class="mb-6">
        <p id="selectedLabel" class="text-sm text-sage-600 font-medium"></p>
        <h2 id="selectedTitle" class="text-2xl sm:text-3xl font-bold mt-1"></h2>
      </div>

      <!-- 달성률 프로그레스 바 -->
      <div class="bg-beige-50 rounded-2xl p-5 mb-6">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm font-medium text-stone-600">오늘의 달성률</span>
          <span id="progressText" class="text-sm font-semibold text-sage-700">0%</span>
        </div>
        <div class="w-full h-3 bg-beige-200 rounded-full overflow-hidden">
          <div id="progressFill" class="h-full w-0 rounded-full bg-black"></div>
        </div>
        <p id="progressMessage" class="text-xs text-stone-500 mt-3"></p>
      </div>

      <!-- 할 일 입력 폼 -->
      <form id="todoForm" class="mb-6">
        <!-- 태그 선택 버튼들 -->
        <div id="tagSelector" class="flex flex-wrap gap-2 mb-3">
          <!-- data-tag 값으로 어떤 태그인지 구분합니다 -->
          <button type="button" data-tag="work"  class="tag-btn px-4 py-2 rounded-full text-sm font-medium border-2 transition">💼 취업/업무</button>
          <button type="button" data-tag="life"  class="tag-btn px-4 py-2 rounded-full text-sm font-medium border-2 transition">🏡 일상</button>
          <button type="button" data-tag="study" class="tag-btn px-4 py-2 rounded-full text-sm font-medium border-2 transition">📚 자기계발</button>
        </div>

        <!-- 입력창 + 추가 버튼 -->
        <div class="flex gap-2">
          <input id="todoInput"
                 type="text"
                 maxlength="100"
                 placeholder="오늘 해낼 일을 적어보세요 ✍️"
                 class="flex-1 min-w-0 px-5 py-3.5 rounded-2xl bg-beige-50 border-2 border-transparent focus:border-sage-300 focus:bg-white outline-none transition placeholder:text-stone-400" />
          <button type="submit"
                  class="px-6 py-3.5 rounded-2xl bg-sage-500 hover:bg-sage-600 active:scale-95 text-white font-semibold transition shadow-sm">
            추가
          </button>
        </div>
      </form>

      <!-- 할 일 목록이 그려지는 곳 -->
      <ul id="todoList" class="flex-1 space-y-3 overflow-y-auto soft-scroll pr-1 max-h-[50vh] lg:max-h-none"></ul>

      <!-- 할 일이 하나도 없을 때 보여줄 안내 문구 -->
      <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center text-center py-12 text-stone-400">
        <div class="text-5xl mb-4">🌱</div>
        <p class="font-medium text-stone-500">아직 등록된 할 일이 없어요</p>
        <p class="text-sm mt-1">작은 목표 하나부터 시작해볼까요?</p>
      </div>
    </section>
  </main>

  <script>
    /* ==============================================================
       4) 기본 설정값
       ============================================================== */

    // LocalStorage에 저장할 때 사용할 이름(열쇠)
    const STORAGE_KEY = 'pastel-todo-data';

    // 태그 종류별 이름과 색상 정보 (흑백 톤으로 서로 구분되게)
    //  - 취업/업무 : 검정 배경 + 흰 글씨
    //  - 일상      : 회색 배경 + 검정 글씨
    //  - 자기계발  : 흰 배경 + 검정 테두리
    const TAGS = {
      work:  { label: '💼 취업/업무', badge: 'bg-neutral-900 text-white',                       active: 'bg-neutral-900 border-neutral-900 text-white' },
      life:  { label: '🏡 일상',      badge: 'bg-neutral-200 text-neutral-800',                 active: 'bg-neutral-200 border-neutral-400 text-neutral-900' },
      study: { label: '📚 자기계발',  badge: 'bg-white text-neutral-800 ring-1 ring-neutral-400', active: 'bg-white border-neutral-900 text-neutral-900' },
    };
    const TAG_INACTIVE = 'bg-white border-beige-200 text-stone-500 hover:border-stone-400';

    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

    /* ==============================================================
       5) 앱의 "상태(state)" — 지금 화면이 어떤 상태인지 기억하는 변수들
       ============================================================== */
    const today = new Date();
    let viewYear  = today.getFullYear();   // 달력에 보이는 연도
    let viewMonth = today.getMonth();      // 달력에 보이는 월 (0 = 1월, 11 = 12월)
    let selectedDate = toDateKey(today);   // 선택된 날짜 (기본값: 오늘) 예: "2026-10-06"
    let selectedTag = 'work';              // 현재 선택된 태그 (기본값: 취업/업무)

    // 전체 할 일 데이터. 날짜를 열쇠로 하는 객체 형태입니다.
    // 예: { "2026-10-06": [ { id, text, tag, done }, ... ], ... }
    let todosByDate = loadTodos();

    /* ==============================================================
       6) HTML 요소 가져오기
       ============================================================== */
    const $ = (id) => document.getElementById(id);
    const monthTitle    = $('monthTitle');
    const calendarGrid  = $('calendarGrid');
    const selectedLabel = $('selectedLabel');
    const selectedTitle = $('selectedTitle');
    const progressFill  = $('progressFill');
    const progressText  = $('progressText');
    const progressMsg   = $('progressMessage');
    const todoForm      = $('todoForm');
    const todoInput     = $('todoInput');
    const todoList      = $('todoList');
    const emptyState    = $('emptyState');
    const tagButtons    = document.querySelectorAll('.tag-btn');

    /* ==============================================================
       7) 날짜 도우미 함수
       ============================================================== */

    // Date 객체를 "YYYY-MM-DD" 문자열로 바꿔줍니다. (저장용 열쇠로 사용)
    function toDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // "YYYY-MM-DD" 문자열을 다시 Date 객체로 바꿔줍니다.
    function fromDateKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    /* ==============================================================
       8) LocalStorage 저장 / 불러오기
       - 브라우저 안에 데이터를 저장해서 새로고침해도 사라지지 않게 합니다.
       ============================================================== */
    function loadTodos() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        // 저장된 데이터가 깨졌거나 저장소를 쓸 수 없는 경우 빈 데이터로 시작
        return {};
      }
    }

    function saveTodos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todosByDate));
      } catch (e) {
        console.warn('저장에 실패했어요:', e);
      }
    }

    // 선택된 날짜의 할 일 배열을 돌려줍니다. (없으면 빈 배열)
    function getTodosOf(dateKey) {
      return todosByDate[dateKey] || [];
    }

    /* ==============================================================
       9) 달력 그리기
       ============================================================== */
    function renderCalendar() {
      monthTitle.textContent = `${viewYear}년 ${viewMonth + 1}월`;
      calendarGrid.innerHTML = '';

      const firstDay    = new Date(viewYear, viewMonth, 1).getDay();      // 이번 달 1일의 요일 (0=일요일)
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate(); // 이번 달의 마지막 날짜
      const todayKey    = toDateKey(today);

      // (1) 1일이 시작되기 전까지 빈 칸 채우기
      for (let i = 0; i < firstDay; i++) {
        calendarGrid.appendChild(document.createElement('div'));
      }

      // (2) 1일부터 마지막 날까지 날짜 버튼 만들기
      for (let day = 1; day <= daysInMonth; day++) {
        const date    = new Date(viewYear, viewMonth, day);
        const dateKey = toDateKey(date);
        const weekday = date.getDay();
        const todos   = getTodosOf(dateKey);

        const isToday    = dateKey === todayKey;
        const isSelected = dateKey === selectedDate;

        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'relative aspect-square rounded-2xl flex flex-col items-center justify-center text-sm sm:text-base transition border-2 ';

        // 상태에 따라 스타일 다르게 입히기
        if (isSelected) {
          // 선택된 날짜: 진한 그린 배경 + 흰 글씨
          cell.className += 'bg-sage-500 border-sage-500 text-white font-semibold shadow-md scale-105';
        } else if (isToday) {
          // 오늘 날짜: 흰 배경 + 검정 테두리
          cell.className += 'bg-white border-sage-500 text-black font-semibold';
        } else {
          // 평범한 날짜: 주말(일·토)은 연한 회색, 평일은 진한 회색
          const color = weekday === 0 || weekday === 6 ? 'text-stone-400' : 'text-stone-600';
          cell.className += `border-transparent hover:bg-beige-200 ${color}`;
        }

        // 날짜 숫자
        const num = document.createElement('span');
        num.textContent = day;
        cell.appendChild(num);

        // 할 일이 있는 날에는 작은 점 표시 (모두 완료했으면 ✓ 느낌으로 진하게)
        if (todos.length > 0) {
          const allDone = todos.every((t) => t.done);
          const dot = document.createElement('span');
          dot.className = 'absolute bottom-1.5 w-1.5 h-1.5 rounded-full ' +
            (isSelected ? 'bg-white' : allDone ? 'bg-sage-600' : 'bg-sage-300');
          cell.appendChild(dot);
        }

        cell.setAttribute('aria-label', `${viewMonth + 1}월 ${day}일`);
        if (isSelected) cell.setAttribute('aria-pressed', 'true');

        // 날짜 클릭 → 선택 날짜 변경 후 화면 다시 그리기
        cell.addEventListener('click', () => {
          selectedDate = dateKey;
          renderAll();
        });

        calendarGrid.appendChild(cell);
      }
    }

    /* ==============================================================
       10) 오른쪽 상단: 선택한 날짜 타이틀
       ============================================================== */
    function renderSelectedTitle() {
      const date = fromDateKey(selectedDate);
      const isToday = selectedDate === toDateKey(today);

      selectedLabel.textContent = isToday ? 'TODAY ✨' : `${date.getFullYear()}년`;
      selectedTitle.textContent =
        `${date.getMonth() + 1}월 ${date.getDate()}일 ${WEEKDAYS[date.getDay()]}요일`;
    }

    /* ==============================================================
       11) 할 일 목록 그리기
       ============================================================== */
    function renderTodos() {
      const todos = getTodosOf(selectedDate);
      todoList.innerHTML = '';

      // 할 일이 없으면 안내 문구를 보여주고 목록은 숨깁니다.
      const isEmpty = todos.length === 0;
      emptyState.classList.toggle('hidden', !isEmpty);
      emptyState.classList.toggle('flex', isEmpty);
      todoList.classList.toggle('hidden', isEmpty);

      todos.forEach((todo) => {
        const tag = TAGS[todo.tag] || TAGS.life;

        // <li> 한 줄 = 할 일 하나
        const li = document.createElement('li');
        li.className = 'group flex items-center gap-3 px-4 py-3.5 rounded-2xl border-2 transition ' +
          (todo.done ? 'bg-beige-50 border-transparent' : 'bg-white border-beige-100 hover:border-sage-200');
        if (todo.id === lastAddedId) li.classList.add('pop-in');

        // ② 체크박스: 체크하면 완료 처리
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'todo-check';
        checkbox.checked = todo.done;
        checkbox.setAttribute('aria-label', '완료 표시');
        checkbox.addEventListener('change', () => toggleTodo(todo.id));

        // 할 일 내용 (완료되면 취소선)
        // ※ 사용자가 입력한 글은 textContent로 넣어야 안전합니다.
        const text = document.createElement('span');
        text.textContent = todo.text;
        text.className = 'flex-1 min-w-0 break-words transition ' +
          (todo.done ? 'line-through text-stone-400' : 'text-stone-700');

        // ④ 태그 배지
        const badge = document.createElement('span');
        badge.textContent = tag.label;
        badge.className = `shrink-0 px-2.5 py-1 rounded-full text-xs font-medium ${tag.badge} ${todo.done ? 'opacity-50' : ''}`;

        // ③ 삭제(X) 버튼
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.innerHTML = '&times;';
        delBtn.setAttribute('aria-label', '삭제');
        delBtn.className = 'shrink-0 w-8 h-8 rounded-full text-xl leading-none text-stone-400 hover:text-black hover:bg-beige-100 transition';
        delBtn.addEventListener('click', () => deleteTodo(todo.id));

        li.append(checkbox, text, badge, delBtn);
        todoList.appendChild(li);
      });

      lastAddedId = null;
    }

    /* ==============================================================
       12) 프로그레스 바 (달성률) 그리기
       ============================================================== */
    function renderProgress() {
      const todos = getTodosOf(selectedDate);
      const total = todos.length;
      const done  = todos.filter((t) => t.done).length;
      const percent = total === 0 ? 0 : Math.round((done / total) * 100);

      progressFill.style.width = percent + '%';
      progressText.textContent = `${percent}%  (${done}/${total})`;

      // 달성률에 따라 응원 메시지 바꾸기
      let message;
      if (total === 0)        message = '할 일을 추가하면 달성률이 표시돼요.';
      else if (percent === 100) message = '🎉 완벽해요! 오늘 정말 수고 많았어요.';
      else if (percent >= 70) message = '💪 거의 다 왔어요, 조금만 더 힘내요!';
      else if (percent >= 30) message = '🌿 차근차근 잘 해내고 있어요.';
      else                    message = '☕ 천천히, 하나씩 시작해봐요.';
      progressMsg.textContent = message;
    }

    /* ==============================================================
       13) 태그 선택 버튼 스타일 업데이트
       ============================================================== */
    function renderTagSelector() {
      tagButtons.forEach((btn) => {
        const key = btn.dataset.tag;
        const isActive = key === selectedTag;
        // 기본 클래스는 유지하고, 활성/비활성 색상만 바꿔 끼웁니다.
        btn.className = 'tag-btn px-4 py-2 rounded-full text-sm font-medium border-2 transition ' +
          (isActive ? TAGS[key].active : TAG_INACTIVE);
        btn.setAttribute('aria-pressed', isActive);
      });
    }

    // 화면 전체를 한 번에 새로 그리는 함수
    function renderAll() {
      renderCalendar();
      renderSelectedTitle();
      renderTodos();
      renderProgress();
    }

    /* ==============================================================
       14) 할 일 추가 / 완료 토글 / 삭제
       ============================================================== */
    let lastAddedId = null; // 방금 추가한 항목에만 애니메이션을 주기 위해 기억

    // ① 할 일 추가
    function addTodo(text) {
      const newTodo = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), // 고유 번호
        text,
        tag: selectedTag,
        done: false,
      };
      todosByDate[selectedDate] = [...getTodosOf(selectedDate), newTodo];
      lastAddedId = newTodo.id;
      saveTodos();
      renderAll();
    }

    // ② 완료 / 미완료 전환
    function toggleTodo(id) {
      todosByDate[selectedDate] = getTodosOf(selectedDate).map((t) =>
        t.id === id ? { ...t, done: !t.done } : t
      );
      saveTodos();
      renderAll();
    }

    // ③ 삭제
    function deleteTodo(id) {
      const remaining = getTodosOf(selectedDate).filter((t) => t.id !== id);
      if (remaining.length > 0) {
        todosByDate[selectedDate] = remaining;
      } else {
        delete todosByDate[selectedDate]; // 비어 있는 날짜는 저장소에서 정리
      }
      saveTodos();
      renderAll();
    }

    /* ==============================================================
       15) 이벤트 연결 (버튼 클릭, 입력 등)
       ============================================================== */

    // 이전 달 버튼
    $('prevMonthBtn').addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderCalendar();
    });

    // 다음 달 버튼
    $('nextMonthBtn').addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderCalendar();
    });

    // 오늘로 이동 버튼
    $('todayBtn').addEventListener('click', () => {
      viewYear = today.getFullYear();
      viewMonth = today.getMonth();
      selectedDate = toDateKey(today);
      renderAll();
    });

    // 태그 버튼 클릭 → 선택 태그 변경
    tagButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        selectedTag = btn.dataset.tag;
        renderTagSelector();
        todoInput.focus();
      });
    });

    // 추가 버튼 클릭 또는 Enter 키 → 할 일 추가
    todoForm.addEventListener('submit', (event) => {
      event.preventDefault(); // 폼 제출 시 페이지가 새로고침되는 기본 동작 막기
      const text = todoInput.value.trim();
      if (!text) {
        // 빈 칸이면 입력창 테두리를 잠깐 검정으로 바꿔서 알려줌
        todoInput.classList.add('!border-black');
        setTimeout(() => todoInput.classList.remove('!border-black'), 600);
        todoInput.focus();
        return;
      }
      addTodo(text);
      todoInput.value = '';
      todoInput.focus();
    });

    /* ==============================================================
       16) 처음 페이지가 열릴 때 화면 그리기
       ============================================================== */
    renderTagSelector();
    renderAll();
  </script>
</body>
</html>
